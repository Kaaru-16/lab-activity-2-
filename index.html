<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Left 4 Dead 2</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================================
         NAVIGATION
    ========================================== -->
    <header class="navbar">
        <nav class="nav-links">
            <a href="#about">ABOUT</a>
            <a href="#survivors">SURVIVORS</a>
            <a href="#download" class="active">DOWNLOAD</a>
            <a href="#infected">INFECTED</a>
            <a href="#gallery">GALLERY</a>
        </nav>
    </header>

    <!-- =========================================
         HERO SECTION
    ========================================== -->
    <main>
        <section class="hero">

            <!-- BACKGROUND -->
            <div class="hero-background"></div>

            <!-- =====================================
                 CHARACTERS
            ====================================== -->
            <img src="images/ELLIS.png" alt="Ellis" class="character character1">
            <img src="images/NICK & ROCHELLE.png" alt="Nick and Rochelle" class="character character2">
            <img src="images/COACH.png" alt="Coach" class="character character3">

            <!-- =====================================
                 GAME LOGO
            ====================================== -->
            <img src="images/logo.png" alt="Left 4 Dead 2" class="game-logo">

            <!-- =====================================
                 PLAY NOW BUTTON
            ====================================== -->
            <a href="https://store.steampowered.com/app/550/Left_4_Dead_2/" class="play-button" target="_blank" rel="noopener noreferrer">
                PLAY NOW
            </a>

            <!-- =====================================
                 BOTTOM LOGOS
            ====================================== -->
            <img src="images/image 2.png" alt="Game information" class="bottom-logos">

        </section>

        <!-- =====================================
             ABOUT SECTION (Image Background Only)
        ====================================== -->
        <section class="about-section" id="about"></section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="js/script.js"></script>

</body>
</html>
